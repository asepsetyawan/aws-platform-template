services:
  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      APP_ENV: local
      HTTP_ADDR: :9090
      GRPC_ADDR: :50051
      GRPC_INSECURE: 'true'
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - /server
      - check
      interval: 3s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
  api:
    build:
      context: .
      args:
        SERVICE: api
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      CATALOG_GRPC_ADDR: dns:///catalog:50051
      GRPC_INSECURE: 'true'
      GRPC_TIMEOUT: 800ms
    depends_on:
      catalog:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - /server
      - check
      interval: 3s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
  kong:
    image: kong:3.9.4@sha256:8485cabdadb0320212baf1b3f3f47ab293438a61691d198154ccd899d5aabb65
    user: 1000:1000
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong-config/kong.yaml
      KONG_PREFIX: /tmp/kong
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_ADMIN_LISTEN: 'off'
      KONG_ADMIN_GUI_LISTEN: 'off'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_STATUS_ACCESS_LOG: 'off'
      KONG_NGINX_WORKER_PROCESSES: '2'
      KONG_NGINX_WORKER_SHUTDOWN_TIMEOUT: 30s
      KONG_PLUGINS: prometheus,rate-limiting
    ports:
    - 127.0.0.1:8080:8000
    volumes:
    - ./kong.yaml:/etc/kong-config/kong.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - kong
      - health
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 45s
