global:
  securityContext:
    runAsNonRoot: true
server:
  replicas: 2
  service: {type: ClusterIP}
controller: {replicas: 1}
repoServer: {replicas: 2}
applicationSet: {replicas: 2}
configs:
  cm:
    admin.enabled: 'false'
    # Configure your OIDC/SSO connector and RBAC BEFORE disabling bootstrap admin.
  rbac:
    policy.default: role:readonly
