apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: kong
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: kong
      containers:
      - name: kong
        image: kong:3.9.4@sha256:8485cabdadb0320212baf1b3f3f47ab293438a61691d198154ccd899d5aabb65
        ports:
        - name: proxy
          containerPort: 8000
        - name: status
          containerPort: 8100
        env:
        - name: KONG_DATABASE
          value: 'off'
        - name: KONG_DECLARATIVE_CONFIG
          value: /etc/kong-config/kong.yaml
        - name: KONG_PREFIX
          value: /tmp/kong
        - name: KONG_PROXY_LISTEN
          value: 0.0.0.0:8000
        - name: KONG_STATUS_LISTEN
          value: 0.0.0.0:8100
        - name: KONG_ADMIN_LISTEN
          value: 'off'
        - name: KONG_ADMIN_GUI_LISTEN
          value: 'off'
        - name: KONG_PROXY_ACCESS_LOG
          value: /dev/stdout
        - name: KONG_PROXY_ERROR_LOG
          value: /dev/stderr
        - name: KONG_STATUS_ACCESS_LOG
          value: 'off'
        - name: KONG_NGINX_WORKER_PROCESSES
          value: '2'
        - name: KONG_NGINX_WORKER_SHUTDOWN_TIMEOUT
          value: 30s
        - name: KONG_TRACING_INSTRUMENTATIONS
          value: all
        - name: KONG_TRACING_SAMPLING_RATE
          value: '0.1'
        - name: KONG_PLUGINS
          value: prometheus,rate-limiting,opentelemetry
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /status
            port: status
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /status/ready
            port: status
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /status
            port: status
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: kong-config
          mountPath: /etc/kong-config
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: kong-config
        configMap:
          name: kong-config
