fullnameOverride: otel
mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: {endpoint: '0.0.0.0:4317'}
        http: {endpoint: '0.0.0.0:4318'}
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
      spike_limit_mib: 40
    batch: {}
  exporters:
    debug: null
    otlphttp/tempo:
      endpoint: http://tempo.observability.svc.cluster.local:4318
      sending_queue: {enabled: true, queue_size: 2048}
      retry_on_failure: {enabled: true}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/tempo]
      metrics: null
      logs: null
