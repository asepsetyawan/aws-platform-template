apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: api
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: api
      containers:
      - name: api
        image: platform-api:bootstrap
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_ENV
          value: dev
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel.observability.svc.cluster.local:4318
        - name: OTEL_SERVICE_NAME
          value: platform-api
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_traceidratio
        - name: OTEL_TRACES_SAMPLER_ARG
          value: '0.1'
        - name: CATALOG_GRPC_ADDR
          value: dns:///catalog:50051
        - name: GRPC_TIMEOUT
          value: 800ms
        - name: GRPC_CA_FILE
          value: /etc/grpc-ca/ca.crt
        - name: GRPC_SERVER_NAME
          value: catalog
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /livez
            port: http
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command:
              - /server
              - drain
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: grpc-ca
          mountPath: /etc/grpc-ca
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: grpc-ca
        secret:
          secretName: catalog-client-ca
          defaultMode: 288
