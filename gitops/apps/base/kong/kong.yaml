_format_version: '3.0'
_transform: true
services:
- name: platform-api
  url: http://api:8080
  connect_timeout: 1000
  read_timeout: 5000
  write_timeout: 5000
  retries: 0
  routes:
  - name: public-rest
    paths:
    - /api/
    protocols:
    - http
    - https
    strip_path: false
    preserve_host: false
  plugins:
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      limit_by: service
      fault_tolerant: false
plugins:
- name: prometheus
  config:
    status_code_metrics: true
    latency_metrics: true
    bandwidth_metrics: true
    per_consumer: false
- name: opentelemetry
  config:
    traces_endpoint: http://otel.observability.svc.cluster.local:4318/v1/traces
    resource_attributes:
      service.name: platform-kong
    propagation:
      default_format: w3c
