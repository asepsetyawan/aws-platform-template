name: Build and publish Go services
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: build-services
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, catalog]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go test -race ./...
        working-directory: app
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build once for scanning and publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: app
          build-args: SERVICE=${{ matrix.service }}
          load: true
          platforms: linux/amd64
          tags: platform-${{ matrix.service }}:scan
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: platform-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Publish the scanned image
        env:
          ECR_REPOSITORY_URL: ${{ matrix.service == 'api' && vars.ECR_REPOSITORY_URL || vars.ECR_CATALOG_REPOSITORY_URL }}
          LAB_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          test -n "$ECR_REPOSITORY_URL"
          docker tag "platform-$LAB_SERVICE:scan" "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY_URL:$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPOSITORY_URL:$GITHUB_SHA")
          echo "Published $LAB_SERVICE image: $digest" >> "$GITHUB_STEP_SUMMARY"
